[project]
name = "vmb-backend"
version = "0.1.0"
description = "VRM Motion Bench orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2",
  "pyyaml>=6",
  "docker>=7",
  "nvidia-ml-py>=12",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "sourcemotion",
]

[project.scripts]
vmb-backend = "vmb_backend.main:main"

[tool.uv.sources]
sourcemotion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmb_backend"]
