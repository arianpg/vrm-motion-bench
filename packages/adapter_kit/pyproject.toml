[project]
name = "vmb-adapter"
version = "0.1.0"
description = "Common HTTP server for VRM Motion Bench adapters"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "sourcemotion"]

[tool.uv.sources]
sourcemotion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmb_adapter"]
